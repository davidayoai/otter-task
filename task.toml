schema_version = "1.3"
runtime_limits = 14400

[task]
name = "otter/fairness-tabular-classification"
description = "Train a fair tabular classification model with audited platform FPR parity."

[metadata]
domain = "tabular-ml"
subdomain = "classification"
tags = ["tabular", "classification", "fairness"]
source_dataset = ""
source_url = ""
source_reference_id = ""
source_license = ""

[environment]
build_timeout_sec = 1200.0
workdir = "/app"
os = "linux"
cpus = 8
memory_mb = 32768
storage_mb = 81920
gpus = 1
gpu_types = ["T4"]
allow_internet = true

[agent]
timeout_sec = 14400.0

[verifier]
timeout_sec = 900.0